<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body{
            background-color: rgb(94, 23, 160);
        }
        h1{
            
            color: aliceblue;
            text-align: center;
            margin: auto;
            padding: 30px;
            width: 90vw;
        }
        main{
            background-color: black;
            color: azure;
            margin: auto;
            padding: 20px;
            width: 90vw;
            height: 80vh;
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            align-content: space-evenly;
            border-radius: 20px;
           
        }
        section#sec1{
            height: 300px;
            text-align: center;
            border: 1px solid ;
            flex: 0 1 400px;
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
        }
        section#sec1 > input#txt1{
            height: 50px;
            text-align: center;
            margin: 10px;
            font-size: 2em;
            
        }
        section#sec1 > input#txt2{
            height: 50px;
            text-align: center;
            margin: 10px;
            font-size: 2em;
        }
        div#res{
            border: 1px solid;
            height: 50px;
            padding: 10px;
            margin: 10px;
            font-size: 1.6em;
            
        }
        section#sec2{
            height: 300px;
            border: 1px solid;
            flex: 0 1 300px;
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
        }
        section#sec2 > input{
            height: 50px;
            text-align: center;
            margin: 10px;
            font-size: 2em;
            
        }
    </style>
</head>
<body>
    <h1>Calculadora Simples</h1>
    <main>
        <section id="sec1">
            <input type="number" name="txt1" id="txt1">
            <input type="number" name="txt2" id="txt2">
            <div id="res">Resultado</div>
        </section>
        <section id="sec2">
            <input type="button" value="Somar" onclick= "somar()">
            <input type="button" value="Multiplicar" onclick= "multiplicar()">
            <input type="button" value="Dividir" onclick= "dividir()">
        </section>
    </main>
    <script>
        function somar(){
        var v1 = document.getElementById('txt1')
        var v2 = document.getElementById('txt2')
        var total = document.querySelector('div#res') 
        var valor1 = Number(v1.value)
        var valor2 = Number(v2.value)
        var result = valor1 + valor2
        total.innerHTML = `A soma entre ${valor1} e  ${valor2} é ${result}`
        }
        function multiplicar(){
        var v1 = document.getElementById('txt1')
        var v2 = document.getElementById('txt2')
        var total = document.querySelector('div#res') 
        var valor1 = Number(v1.value)
        var valor2 = Number(v2.value)
        var result = valor1 * valor2
        total.innerHTML = `A multiplicação entre ${valor1} e  ${valor2} é ${result}`
        }
        function dividir(){
        var v1 = Number(document.getElementById('txt1').value)
        var v2 = Number(document.getElementById('txt2').value)
        var total = document.querySelector('div#res')
        var result = v1 / v2
        total.innerHTML = `A Divisão de ${v1} por ${v2} é ${result.toFixed(2)}`
        }
    </script>
</body>
</html>
