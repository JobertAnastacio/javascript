<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    <label for="ivel">Velocidade do carro</label>
    <input type="number" name="vel" id="ivel">
    <input type="submit" value="Enviar" onclick="multa()">
    <div id="txt"></div>
    <script>
        
        function multa(){
            var vel = Number(document.getElementById('ivel').value)
            var resultado = document.querySelector('div#txt')
            resultado.innerHTML = `<p>Sua velocidade foi de <strong>${vel} Km/h</strong> </p>`
            if (vel > 65){
                resultado.innerHTML += '<p>Você foi <strong>Multado</strong>!</p>'
            } else{
                resultado.innerHTML += '<p>Dirija com segurança</p>'
            }
        }
    </script>
</body>
</html>
