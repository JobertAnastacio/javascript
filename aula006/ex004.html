<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Tit{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <script>
        var n = String((window.prompt('Qual seu nome? ')))
        document.write(`<h1 id = "Tit">Seu nome tem ${n.length} Letras.</h1>`)
        document.write(`Seu nome em maiusculo é ${n.toUpperCase()}<br>`)
        document.write(`Em minusculo é ${n.toLowerCase()}`)
    </script>
</body>
</html>
