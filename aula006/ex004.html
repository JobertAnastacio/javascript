<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n = String((window.prompt('Qual seu nome? ')))
        document.write(`Seu nome tem ${n.length} Letras.<br>`)
        document.write(`Seu nome em maiusculo é ${n.toUpperCase()}<br>`)
        document.write(`Em minusculo é ${n.toLowerCase()}`)
    </script>
</body>
</html>
